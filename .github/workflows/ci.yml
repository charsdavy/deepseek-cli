name: CI

on:
  push:
    branches: [main, master, "feature/**", "release/**"]
  pull_request:
    branches: [main, master]

# Cancel superseded runs on the same ref
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: lint + typecheck + test + build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint (tsc + biome correctness gate)
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test

      - name: Coverage
        run: bun run coverage
        continue-on-error: true

      - name: Build (smoke)
        run: bun run build

      - name: Verify binary runs
        run: ./dist/deepseek --version

      - name: Upload build artifact (debug)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deepseek-${{ matrix.os }}-build
          path: dist/deepseek
          if-no-files-found: ignore
          retention-days: 3
