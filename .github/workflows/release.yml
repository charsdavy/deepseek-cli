name: Release

# Triggered by git tags matching `v*.*.*` (or `v*.*.*-*` for pre-releases).
# Builds native binaries for 4 Homebrew-relevant targets via Bun's
# cross-compile, uploads them to a GitHub Release, then regenerates the
# Homebrew formula in `charsdavy/homebrew-tap` with the new SHAs.

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*-*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version (without leading v)"
        required: true
        default: "0.4.0"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build + Release + Homebrew tap
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ github.event.inputs.version }}"
          else
            TAG="${GITHUB_REF_NAME#v}"
            V="$TAG"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=v$V" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $V"

      - name: Typecheck + Test (pre-flight)
        run: |
          bun run typecheck
          bun test

      # ---- Cross-compile each target on the same ubuntu host ----
      # Bun supports --target=bun-{os}-{arch} cross-compilation; this lets us
      # build all four binaries in one job without spinning up per-OS runners.
      - name: Build all targets
        id: build
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          mkdir -p artifacts dist
          TARGETS="darwin-arm64 darwin-x64 linux-arm64 linux-x64"
          for T in $TARGETS; do
            echo "==> Building $T"
            rm -rf dist/deepseek deepseek
            bun build src/index.ts --compile --minify \
              --target=bun-"$T" \
              --outfile dist/deepseek
            chmod +x dist/deepseek
            # Tar with the binary renamed to `deepseek` so the Homebrew
            # formula can do `bin.install "deepseek"` uniformly.
            cp dist/deepseek deepseek
            tar czf "deepseek-v${VERSION}-${T}.tar.gz" deepseek
            SHA="$(shasum -a 256 "deepseek-v${VERSION}-${T}.tar.gz" | awk '{print $1}')"
            echo "sha_${T//-/_}=$SHA" >> "$GITHUB_OUTPUT"
            echo "  sha256: $SHA"
          done
          ls -lh deepseek-v*.tar.gz

      - name: Upload artifacts (intermediate)
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: deepseek-v*.tar.gz
          retention-days: 7

      - name: Create GitHub Release
        id: ghrelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          files: deepseek-v*.tar.gz
          fail_on_unmatched_files: true
          draft: false
          prerelease: ${{ contains(steps.ver.outputs.version, '-') }}

      # ---- Regenerate the Homebrew formula in the tap repo ----
      # Requires HOMEBREW_TAP_TOKEN: a GitHub PAT with `repo` scope on
      # the tap repo (charsdavy/homebrew-tap).
      - name: Update Homebrew tap
        if: ${{ github.repository == 'charsdavy/deepseek-cli' }}
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ steps.ver.outputs.version }}
          TAG: ${{ steps.ver.outputs.tag }}
          SHA_DARWIN_ARM64: ${{ steps.build.outputs.sha_darwin_arm64 }}
          SHA_DARWIN_X64: ${{ steps.build.outputs.sha_darwin_x64 }}
          SHA_LINUX_ARM64: ${{ steps.build.outputs.sha_linux_arm64 }}
          SHA_LINUX_X64: ${{ steps.build.outputs.sha_linux_x64 }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN secret is not set; skipping tap update."
            exit 0
          fi
          ./.github/scripts/update-homebrew-tap.sh

      - name: Summary
        run: |
          echo "### Release ${{ steps.ver.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| target | sha256 |" >> "$GITHUB_STEP_SUMMARY"
          echo "| --- | --- |" >> "$GITHUB_STEP_SUMMARY"
          echo "| darwin-arm64 | \`${{ steps.build.outputs.sha_darwin_arm64 }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| darwin-x64 | \`${{ steps.build.outputs.sha_darwin_x64 }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| linux-arm64 | \`${{ steps.build.outputs.sha_linux_arm64 }}\` |" >> "$GITHUB_STEP_SUMMARY"
          echo "| linux-x64 | \`${{ steps.build.outputs.sha_linux_x64 }}\` |" >> "$GITHUB_STEP_SUMMARY"
